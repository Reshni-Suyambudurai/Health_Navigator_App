<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Stacked layers representing governance/hierarchy -->
  <g stroke="#73C7EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top layer -->
    <rect x="3" y="2" width="18" height="6" rx="1" ry="1" fill="none"/>
    <line x1="6" y1="5" x2="18" y2="5"/>
    
    <!-- Middle layer -->
    <rect x="3" y="9" width="18" height="6" rx="1" ry="1" fill="none"/>
    <line x1="6" y1="12" x2="18" y2="12"/>
    
    <!-- Bottom layer -->
    <rect x="3" y="16" width="18" height="6" rx="1" ry="1" fill="none"/>
    <line x1="6" y1="19" x2="18" y2="19"/>
    
    <!-- Vertical connector lines -->
    <line x1="12" y1="8" x2="12" y2="9"/>
    <line x1="12" y1="15" x2="12" y2="16"/>
  </g>
</svg>